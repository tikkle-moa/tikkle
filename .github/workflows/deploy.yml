name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  GITHUB_REPOSITORY: ${{ github.repository }}
  IMAGE_TAG: sha-${{ github.sha }}-${{ github.run_id }}

jobs:
  build-and-push:
    name: Build and push ${{ matrix.app }} image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [client, server]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.GITHUB_REPOSITORY }}/${{ matrix.app }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.IMAGE_TAG }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infra/docker/prod/${{ matrix.app }}.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.GITHUB_REPOSITORY }}/${{ matrix.app }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.GITHUB_REPOSITORY }}/${{ matrix.app }}:buildcache,mode=max

  deploy:
    name: Deploy to Server
    needs: build-and-push
    runs-on: [self-hosted, linux, x64, tikkle]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Login to GHCR
        run: |
          set -euo pipefail

          export DOCKER_CONFIG="$RUNNER_TEMP/tikkle-docker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"

          mkdir -p "$DOCKER_CONFIG"
          chmod 700 "$DOCKER_CONFIG"

          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin

      - name: Deploy production
        run: |
          set -euo pipefail

          test -r /opt/tikkle/.env

          cp infra/docker/prod/docker-compose.yaml /opt/tikkle/docker-compose.yaml
          cd /opt/tikkle

          docker compose config --quiet
          docker compose pull
          docker compose up -d --pull never --wait --wait-timeout 300
          docker compose ps

      - name: Remove registry credentials
        if: ${{ always() }}
        run: rm -rf "$DOCKER_CONFIG"
