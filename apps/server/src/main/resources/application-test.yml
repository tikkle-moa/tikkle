logging:
  level:
    root: WARN

spring:
  application:
    name: server-test

  jpa:
    open-in-view: false
    hibernate:
      # Flyway가 스키마를 완전히 관리하므로 Hibernate는 스키마에 손대지 않습니다.
      ddl-auto: none

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

springwolf:
  enabled: false

app:
  production: false
  base-url: http://localhost:8080
  frontend-url: http://localhost:5173

jwt:
  secret: test-jwt-secret-key-must-be-at-least-32-bytes
  access-token-expiration-minutes: 60
  refresh-token-expiration-days: 30

oauth:
  providers:
    kakao:
      client-id: test-kakao-client-id
      client-secret: test-kakao-client-secret
      authorization-uri: https://kauth.kakao.com/oauth/authorize
      token-uri: https://kauth.kakao.com/oauth/token
      user-info-uri: https://kapi.kakao.com/v2/user/me
      scope: profile_nickname,profile_image,account_email
    google:
      client-id: test-google-client-id
      client-secret: test-google-client-secret
      authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
      token-uri: https://oauth2.googleapis.com/token
      user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
      scope: openid email profile
    naver:
      client-id: test-naver-client-id
      client-secret: test-naver-client-secret
      authorization-uri: https://nid.naver.com/oauth2.0/authorize
      token-uri: https://nid.naver.com/oauth2.0/token
      user-info-uri: https://openapi.naver.com/v1/nid/me
      scope: email profile_image nickname
    github:
      client-id: test-github-client-id
      client-secret: test-github-client-secret
      authorization-uri: https://github.com/login/oauth/authorize
      token-uri: https://github.com/login/oauth/access_token
      user-info-uri: https://api.github.com/user
      scope: user:email
