asyncapi: 3.1.0

id: urn:tikkle:stomp-api

info:
  title: Tikkle STOMP API
  version: 0.1.0
  description: |
    Tikkle의 STOMP-over-WebSocket 메시지 계약입니다.
    WebSocket Handshake와 STOMP CONNECT 이후의 업무 메시지만 정의합니다.
  license:
    name: UNLICENSED

defaultContentType: application/json

servers:
  local:
    host: localhost:8080
    pathname: /ws
    protocol: ws
    protocolVersion: "1.2"
    description: |
      WebSocket transport endpoint.
      STOMP 1.2 subprotocol(v12.stomp)을 사용합니다.
      access_token HttpOnly 쿠키로 Handshake를 인증합니다.
    security:
      - $ref: "#/components/securitySchemes/accessTokenCookie"
    x-stomp-subprotocol: v12.stomp

channels:
  syncCommand:
    address: /api/{domain}/sync
    description: 클라이언트가 도메인 명령을 서버로 전송하는 STOMP SEND destination.
    parameters:
      domain:
        description: 명령을 처리할 도메인 이름.
        examples:
          - performance
          - group
    messages:
      command:
        $ref: "#/components/messages/StompCommand"

  userSyncResponse:
    address: /user/queue/{domain}
    description: 요청자에게만 전송하는 STOMP MESSAGE destination.
    parameters:
      domain:
        description: 명령을 처리한 도메인 이름.
        examples:
          - performance
          - group
    messages:
      commandSuccess:
        $ref: "#/components/messages/StompCommandSuccess"
      commandFailure:
        $ref: "#/components/messages/StompCommandFailure"

operations:
  receiveSyncCommand:
    action: receive
    summary: 클라이언트 도메인 명령 수신
    channel:
      $ref: "#/channels/syncCommand"
    messages:
      - $ref: "#/channels/syncCommand/messages/command"
    x-stomp-frame: SEND

  sendUserSyncResponse:
    action: send
    summary: 요청자 전용 명령 처리 결과 전송
    channel:
      $ref: "#/channels/userSyncResponse"
    messages:
      - $ref: "#/channels/userSyncResponse/messages/commandSuccess"
      - $ref: "#/channels/userSyncResponse/messages/commandFailure"
    x-stomp-frame: MESSAGE

components:
  securitySchemes:
    accessTokenCookie:
      type: httpApiKey
      in: cookie
      name: access_token
      description: WebSocket Handshake에 포함되는 HttpOnly Access Token 쿠키.

  correlationIds:
    requestId:
      description: 요청과 개인 응답을 연결하는 UUID.
      location: $message.payload#/requestId

  messages:
    StompCommand:
      title: STOMP 도메인 명령
      correlationId:
        $ref: "#/components/correlationIds/requestId"
      payload:
        $ref: "#/components/schemas/StompCommandRequest"

    StompCommandSuccess:
      title: STOMP 명령 성공 응답
      correlationId:
        $ref: "#/components/correlationIds/requestId"
      payload:
        $ref: "#/components/schemas/StompCommandSuccess"

    StompCommandFailure:
      title: STOMP 명령 실패 응답
      correlationId:
        $ref: "#/components/correlationIds/requestId"
      payload:
        $ref: "#/components/schemas/StompCommandFailure"

  schemas:
    StompCommandRequest:
      type: object
      additionalProperties: false
      required: [requestId, action, data]
      properties:
        requestId:
          type: string
          format: uuid
        action:
          type: string
          minLength: 1
        data:
          type: object
          description: action별 입력값.

    StompCommandSuccess:
      type: object
      additionalProperties: false
      required: [requestId, action, success, data]
      properties:
        requestId:
          type: string
          format: uuid
        action:
          type: string
        success:
          type: boolean
          enum: [true]
        data:
          type: object

    StompCommandFailure:
      type: object
      additionalProperties: false
      required: [requestId, action, success, error]
      properties:
        requestId:
          type: string
          format: uuid
        action:
          type: string
        success:
          type: boolean
          enum: [false]
        error:
          $ref: "#/components/schemas/StompCommandError"

    StompCommandError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    StompEvent:
      type: object
      additionalProperties: false
      required: [eventId, version, occurredAt, type, data]
      properties:
        eventId:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
          minimum: 1
        occurredAt:
          type: string
          format: date-time
        type:
          type: string
        data:
          type: object
