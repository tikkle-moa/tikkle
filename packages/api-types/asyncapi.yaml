asyncapi: 2.6.0

id: urn:tikkle:stomp-api

info:
  title: Tikkle STOMP API
  version: 0.1.0
  description: |
    Tikkle의 STOMP-over-WebSocket 메시지 계약입니다.
    WebSocket Handshake와 STOMP CONNECT 이후의 업무 메시지만 정의합니다.
  license:
    name: UNLICENSED

tags:
  - name: realtime
    description: STOMP 실시간 메시지 계약

defaultContentType: application/json

servers:
  local:
    url: ws://localhost:8080/ws
    protocol: ws
    protocolVersion: "1.2"
    description: |
      WebSocket transport endpoint.
      STOMP 1.2 subprotocol(v12.stomp)을 사용합니다.
      access_token HttpOnly 쿠키로 Handshake를 인증합니다.
    security:
      - accessTokenCookie: []
    x-stomp-subprotocol: v12.stomp

channels:
  /api/{domain}/sync:
    parameters:
      domain:
        description: 명령을 처리할 도메인 이름.
        schema:
          type: string
          enum: [performance, group]
    subscribe:
      operationId: receiveSyncCommand
      summary: 클라이언트 도메인 명령 수신
      message:
        $ref: "#/components/messages/StompCommand"
      x-stomp-frame: SEND

  /user/queue/{domain}:
    parameters:
      domain:
        description: 명령을 처리한 도메인 이름.
        schema:
          type: string
          enum: [performance, group]
    publish:
      operationId: sendUserSyncResponse
      summary: 요청자 전용 명령 처리 결과 전송
      message:
        oneOf:
          - $ref: "#/components/messages/StompCommandSuccess"
          - $ref: "#/components/messages/StompCommandFailure"
      x-stomp-frame: MESSAGE

components:
  securitySchemes:
    accessTokenCookie:
      type: httpApiKey
      in: cookie
      name: access_token
      description: WebSocket Handshake에 포함되는 HttpOnly Access Token 쿠키.

  messages:
    StompCommand:
      messageId: stomp.command
      name: StompCommand
      title: STOMP 도메인 명령
      payload:
        $ref: "#/components/schemas/StompCommandRequest"

    StompCommandSuccess:
      messageId: stomp.command.success
      name: StompCommandSuccess
      title: STOMP 명령 성공 응답
      payload:
        $ref: "#/components/schemas/StompCommandSuccess"

    StompCommandFailure:
      messageId: stomp.command.failure
      name: StompCommandFailure
      title: STOMP 명령 실패 응답
      payload:
        $ref: "#/components/schemas/StompCommandFailure"

  schemas:
    StompCommandRequest:
      type: object
      additionalProperties: false
      required:
        - requestId
        - action
        - data
      properties:
        requestId:
          type: string
          format: uuid
          description: 재연결·재전송 중복 방지 식별자.
        action:
          type: string
          minLength: 1
          description: 도메인별 명령 이름.
        data:
          type: object
          description: action별 입력값. 구체 schema는 각 도메인 Story에서 추가한다.

    StompCommandSuccess:
      type: object
      additionalProperties: false
      required:
        - requestId
        - action
        - success
        - data
      properties:
        requestId:
          type: string
          format: uuid
        action:
          type: string
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          description: action별 성공 결과.

    StompCommandFailure:
      type: object
      additionalProperties: false
      required:
        - requestId
        - action
        - success
        - error
      properties:
        requestId:
          type: string
          format: uuid
        action:
          type: string
        success:
          type: boolean
          enum: [false]
        error:
          $ref: "#/components/schemas/StompCommandError"

    StompCommandError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: 도메인 오류 코드.
        message:
          type: string
          description: 사용자 표시용 오류 메시지.

    StompEvent:
      type: object
      additionalProperties: false
      required:
        - eventId
        - version
        - occurredAt
        - type
        - data
      properties:
        eventId:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
          minimum: 1
        occurredAt:
          type: string
          format: date-time
        type:
          type: string
        data:
          type: object
          description: 이벤트별 공개 데이터.
