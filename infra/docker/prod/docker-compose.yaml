name: tikkle-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  client:
    # CI 등에서 빌드해 GHCR에 게시한 이미지를 내려받습니다.
    image: ghcr.io/${GITHUB_REPOSITORY:?GITHUB_REPOSITORY is required}/client:${IMAGE_TAG:-latest}
    container_name: tikkle-client
    pull_policy: always
    networks:
      - tikkle-network
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:?DOMAIN_NAME is required}
      CERTIFICATE_NAME: ${CERTIFICATE_NAME:?CERTIFICATE_NAME is required}
      # Nginx 자체 변수($host 등)를 보존하고 템플릿 변수만 치환합니다.
      NGINX_ENVSUBST_FILTER: "^(DOMAIN_NAME|CERTIFICATE_NAME)$$"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      server:
        condition: service_healthy
    restart: always
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  server:
    # CI 등에서 빌드해 GHCR에 게시한 이미지를 내려받습니다.
    image: ghcr.io/${GITHUB_REPOSITORY:?GITHUB_REPOSITORY is required}/server:${IMAGE_TAG:-latest}
    container_name: tikkle-server
    pull_policy: always
    networks:
      - tikkle-network
    expose:
      - "8080"
    env_file:
      - .env
    environment:
      LOAD_DOTENV: "false"
      APP_PRODUCTION: "true"
      SERVER_BASE_URL: https://${DOMAIN_NAME:?DOMAIN_NAME is required}
      FRONTEND_URL: https://${DOMAIN_NAME:?DOMAIN_NAME is required}
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:?MYSQL_DATABASE is required}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: ${MYSQL_USER:?MYSQL_USER is required}
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      SPRINGDOC_API_DOCS_ENABLED: "false"
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    stop_grace_period: 30s
    logging: *logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  mysql:
    networks:
      - tikkle-network
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always
    logging: *logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -h 127.0.0.1 -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}" -e "SELECT 1" > /dev/null',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    networks:
      - tikkle-network
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      [
        "sh",
        "-c",
        'exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"',
      ]
    volumes:
      - redis_data:/data
    restart: always
    logging: *logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -qx PONG',
        ]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mysql_data:
  redis_data:

# 서비스 이름으로 서로 통신하는 배포 전용 bridge 네트워크입니다.
networks:
  tikkle-network:
    name: tikkle-network
    driver: bridge
