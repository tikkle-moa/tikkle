# 컨테이너 시작 시 공식 Nginx 이미지의 envsubst가 도메인과 인증서 이름을 치환합니다.
server {
    listen 80;
    server_name ${DOMAIN_NAME};
    server_tokens off;

    # 인증서 갱신 및 HTTPS 리다이렉트와 독립적인 내부 헬스 체크입니다.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://${DOMAIN_NAME}$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN_NAME};

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # 호스트에서 발급한 인증서를 읽기 전용으로 마운트합니다.
    ssl_certificate /etc/letsencrypt/live/${CERTIFICATE_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${CERTIFICATE_NAME}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    location /api/ {
        # 서버 컨테이너 재생성으로 IP가 바뀌어도 Docker DNS로 다시 찾습니다.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://server:8080;
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 내용 해시를 포함한 Vite 빌드 산출물에만 장기 캐시를 적용합니다.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA 경로를 직접 열거나 새로고침할 때 index.html을 제공합니다.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
